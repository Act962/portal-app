name: portal-app

services:
  mongodb:
    image: mongo:8
    container_name: portal-app-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: portal-app
    ports:
      - "27017:27017"
    volumes:
      - portal-app_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  portal-app_mongodb_data:
