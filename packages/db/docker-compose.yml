name: portal-app

# Ambiente de desenvolvimento (Decisão 4a de docs/stack.md).
#
# Credenciais fixas e sem valor: valem só para os containers locais e estão
# espelhadas em apps/web/.env.example. Nada aqui vai para produção.
#
# As major versions (postgres:17, redis:7) são fixadas de propósito: as mesmas
# imagens rodam aqui, no Testcontainers do CI e em produção — é essa paridade
# que elimina a classe de bug "funciona na minha máquina".
#
# O Inngest NÃO entra aqui. No Next.js ele é biblioteca + Dev Server pela CLI
# (`npx inngest-cli@latest dev`), então só o que é stateful vira container.
# Ver docs/specs/00-fundacao.md §5.

services:
  postgres:
    image: postgres:17
    container_name: portal-app-postgres
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal_app
    ports:
      # Porta do host configurável: máquina de dev com outro Postgres rodando
      # é o caso comum, não a exceção. Ajuste POSTGRES_PORT em packages/db/.env
      # e a DATABASE_URL em apps/web/.env para o mesmo valor.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - portal-app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Sem isto o `db:migrate` corre antes do banco aceitar conexão.
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: portal-app-redis
    ports:
      # Configurável pelo mesmo motivo do Postgres: ajuste REDIS_PORT em
      # packages/db/.env se a 6379 já estiver ocupada na sua máquina.
      - "${REDIS_PORT:-6379}:6379"
    # Cache descartável — sem volume de propósito. O que precisa sobreviver a um
    # restart mora no Postgres, não aqui. Ainda não há consumidor: o Redis passa
    # a ser usado a partir da Fase 4 (cache e rate limiting).
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage:
    # Armazenamento de mídia no dev (Fase 2). O RustFS fala a API S3 do R2, então
    # o mesmo adapter S3MediaStorage roda aqui offline e, em produção, no R2 —
    # sem conta em serviço nenhum (Decisão D1). O CI usa a mesma imagem via
    # Testcontainers.
    #
    # Era o MinIO, até as imagens dele saírem do Docker Hub e depois do quay.io:
    # o `pnpm db:start` só funcionava em máquina que já as tinha em cache. As
    # credenciais continuam `minioadmin` de propósito — são as que já estão no
    # `apps/web/.env` de todo mundo, e trocá-las quebraria o upload sem motivo.
    image: rustfs/rustfs:1.0.1
    container_name: portal-app-storage
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      # Console web (inspecionar objetos): http://localhost:9001/rustfs/console/
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      # Volume NOVO, e não o do MinIO reaproveitado: o formato em disco é outro.
      - portal-app_storage_data:/data
    restart: unless-stopped

  storage-init:
    # Provisiona o bucket assim que o armazenamento sobe: cria `portal-media`,
    # deixa-o com leitura pública (o portal serve as imagens por `publicUrl`) e
    # libera o CORS — o painel sobe o arquivo direto do navegador, por URL
    # pré-assinada, e sem a regra o `PUT` é barrado antes de sair. O MinIO
    # respondia CORS aberto por padrão; o RustFS só com a regra no bucket.
    # Roda uma vez e sai — por isso não tem restart.
    image: amazon/aws-cli:2.37.12
    container_name: portal-app-storage-init
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://storage:9000
    entrypoint: >
      /bin/sh -c "
      until aws s3api list-buckets > /dev/null 2>&1; do sleep 1; done;
      aws s3api head-bucket --bucket portal-media > /dev/null 2>&1 || aws s3api create-bucket --bucket portal-media;
      aws s3api put-bucket-policy --bucket portal-media --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::portal-media/*\"]}]}';
      aws s3api put-bucket-cors --bucket portal-media --cors-configuration '{\"CORSRules\":[{\"AllowedOrigins\":[\"*\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"]}]}';
      "

volumes:
  portal-app_postgres_data:
  portal-app_storage_data:
