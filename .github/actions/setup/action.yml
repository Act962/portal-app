name: Setup
description: Instala pnpm + Node e as dependências, com cache do store do pnpm e do Turborepo.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Cache do Turborepo
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-

    - name: Instalar dependências
      run: pnpm install --frozen-lockfile
      shell: bash
