name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push seguido não enfileira execuções obsoletas.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# TZ fixado: o portal tem lógica sensível a horário e o runner roda em UTC.
# Os valores de banco/auth são fixos de CI — dummies que só existem para o build
# e a validação de env passarem; o e2e usa o Postgres de serviço declarado nele.
env:
  TZ: America/Sao_Paulo
  TURBO_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "postgresql://portal:portal@localhost:5432/portal_app?schema=public"
  BETTER_AUTH_SECRET: "ci-secret-com-no-minimo-32-caracteres-para-passar"
  BETTER_AUTH_URL: "http://localhost:3001"
  CORS_ORIGIN: "http://localhost:3001"

# NOTA: o gate de lint/format (`biome ci`) ainda não entra aqui. O scaffold não
# foi formatado com o Biome; o job de lint entra junto da limpeza do repo (ver
# docs/specs/00-fundacao.md §9).

jobs:
  # Bloco rápido e paralelo: se algo aqui falha, os jobs pesados nem começam.
  check:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - { name: typecheck, run: pnpm check-types }
          - { name: arquitetura, run: pnpm depcruise }
          - { name: unit, run: pnpm test:unit }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ${{ matrix.task.run }}

  integration:
    name: integração
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # O runner ubuntu já traz Docker; o Testcontainers sobe o Postgres sozinho.
      - run: pnpm test:integration

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Gerar apps/web/.env para o build
        # O `next build` coleta page-data em workers que só recebem env vars via
        # arquivo .env carregado pelo Next — não as env vars de shell (nem
        # SKIP_ENV_VALIDATION). Localmente isso vem de apps/web/.env; aqui
        # geramos o equivalente com os valores dummy de CI. O build não conecta
        # em nada.
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
            echo "BETTER_AUTH_URL=$BETTER_AUTH_URL"
            echo "CORS_ORIGIN=$CORS_ORIGIN"
          } > apps/web/.env
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal -d portal_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Instalar navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Aplicar migrações no Postgres de teste
        run: pnpm --filter @portal-app/db exec prisma migrate deploy
      - name: E2E
        run: pnpm test:e2e
      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
