packages:
  - apps/*
  - packages/*
  - packages/contexts/*

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  ffmpeg-static: true
  prisma: true
  sharp: true
  skia-canvas: true

# O pnpm fixado no projeto (10.24) só roda scripts de instalação dos pacotes
# desta lista — `allowBuilds` acima é a chave das versões novas e é ignorada
# por ele. Sem o script do skia-canvas, o binário nativo não é baixado, e o
# desenho das artes quebra no CI e no deploy da Vercel. Vale o mesmo para o
# `ffmpeg-static`, cujo script baixa o binário do sistema em que se instala —
# sem ele, o pacote instala vazio e a montagem do vídeo quebra na primeira
# chamada, em produção (spec 12).
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - ffmpeg-static
  - prisma
  - sharp
  - skia-canvas

catalog:
  '@prisma/client': 7.9.1
  '@tailwindcss/postcss': ^4.3.3
  '@trpc/client': ^11.18.0
  '@trpc/server': ^11.18.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  better-auth: 1.6.25
  dotenv: ^17.4.2
  inngest: ^4.18.0
  lucide-react: ^1.27.0
  next: ^16.2.12
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  react-icons: ^5.7.0
  sonner: ^2.0.7
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  zod: ^4.4.3
